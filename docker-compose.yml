name: phoebe

x-app-env: &app-env
  DATABASE_URL: postgres://phoebe:phoebe@postgres:5432/phoebe?sslmode=disable
  HTTP_ADDR: ":8080"
  PUBLIC_BASE_URL: http://localhost:8080
  DEV_LOGIN_ENABLED: "true"
  # dev-only defaults (hex of "dev-signing-secret-not-for-prod!" / "dev-subject-pepper-not-for-prod!"); set real values in deploy
  SIGNING_SECRET: ${SIGNING_SECRET:-6465762d7369676e696e672d7365637265742d6e6f742d666f722d70726f6421}
  SUBJECT_PEPPER: ${SUBJECT_PEPPER:-6465762d7375626a6563742d7065707065722d6e6f742d666f722d70726f6421}
  STORAGE_DIR: /data/storage
  STT_PROVIDER: fake
  LLM_PROVIDER: fake

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: phoebe
      POSTGRES_PASSWORD: phoebe
      POSTGRES_DB: phoebe
    ports:
      # host 5432 is often taken by a local Postgres; override with PHOEBE_PG_PORT=5432
      - "${PHOEBE_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoebe -d phoebe"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: ["/app/api"]
    environment: *app-env
    ports:
      - "8080:8080"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  storage:
